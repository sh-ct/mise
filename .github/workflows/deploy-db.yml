name: Deploy database

# Applies new migrations to the hosted Supabase project after they reach main (docs/SETUP.md §3). Runs once
# the repository variable SUPABASE_PROJECT_ID is set; from then on, missing secrets fail the run rather than
# skipping it. The secrets live in the `production` environment, which only `main` may deploy from.

on:
  push:
    branches: [main]
    paths: ['supabase/migrations/**']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-db
  cancel-in-progress: false

jobs:
  migrate:
    if: vars.SUPABASE_PROJECT_ID != ''
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      # Only this step sees the secrets. The CLI reads SUPABASE_DB_PASSWORD itself and lists what it applies.
      - name: Apply migrations
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
          SUPABASE_PROJECT_ID: ${{ vars.SUPABASE_PROJECT_ID }}
        run: pnpm exec supabase db push --project-ref "$SUPABASE_PROJECT_ID"
