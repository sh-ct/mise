name: Deploy database

# Applies new migrations to the hosted Supabase project after they reach main (docs/SETUP.md). Does nothing
# until the project is configured: repository variable SUPABASE_PROJECT_ID, secrets SUPABASE_ACCESS_TOKEN and
# SUPABASE_DB_PASSWORD, all in the `production` environment.

on:
  push:
    branches: [main]
    paths: ['supabase/migrations/**']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-db
  cancel-in-progress: false

jobs:
  migrate:
    runs-on: ubuntu-latest
    environment: production
    env:
      SUPABASE_PROJECT_ID: ${{ vars.SUPABASE_PROJECT_ID }}
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
    steps:
      - name: Check the hosted project is configured
        id: configured
        run: |
          if [ -z "$SUPABASE_PROJECT_ID" ] || [ -z "$SUPABASE_ACCESS_TOKEN" ] || [ -z "$SUPABASE_DB_PASSWORD" ]; then
            echo "::notice::Hosted Supabase project not configured yet (docs/SETUP.md); skipping."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - if: steps.configured.outputs.ready == 'true'
        uses: actions/checkout@v5
      - if: steps.configured.outputs.ready == 'true'
        uses: pnpm/action-setup@v4
      - if: steps.configured.outputs.ready == 'true'
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
      - if: steps.configured.outputs.ready == 'true'
        run: pnpm install --frozen-lockfile

      - name: Show pending migrations
        if: steps.configured.outputs.ready == 'true'
        run: pnpm exec supabase db push --project-ref "$SUPABASE_PROJECT_ID" --password "$SUPABASE_DB_PASSWORD" --dry-run

      - name: Apply migrations
        if: steps.configured.outputs.ready == 'true'
        run: pnpm exec supabase db push --project-ref "$SUPABASE_PROJECT_ID" --password "$SUPABASE_DB_PASSWORD"
