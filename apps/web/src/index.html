<!doctype html>
<html lang="en" data-theme="bento" data-mode="light">
  <head>
    <meta charset="utf-8" />
    <title>Mise</title>
    <base href="/" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#fbfbf8" />
    <link
      rel="icon"
      type="image/png"
      sizes="32x32"
      href="icons/favicon-32.png"
    />
    <link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />
    <link rel="manifest" href="manifest.webmanifest" />
    <!-- Home-screen app (iOS reads the apple-* tags). iOS's default status bar follows the device's light/dark
         setting, not the app's, but keeps its text legible; the app's own top padding isn't needed under it. -->
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Mise" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <!-- Blocking on purpose: sets data-theme/data-mode before the first paint. -->
    <script src="theme-boot.js"></script>
  </head>
  <body>
    <mise-root></mise-root>
  </body>
</html>
