<a
  href="#main"
  class="sr-only focus:not-sr-only focus:fixed focus:left-4 focus:top-4 focus:z-(--ds-z-sheet) focus:rounded-control focus:bg-primary focus:px-4 focus:py-2 focus:text-on-primary"
  >Skip to content</a
>

<div
  class="min-h-dvh bg-canvas text-ink lg:grid lg:grid-cols-[var(--ds-sidebar-width)_minmax(0,1fr)]"
>
  <!-- Sidebar: desktop -->
  <aside
    class="hidden lg:sticky lg:top-0 lg:flex lg:h-dvh lg:flex-col lg:gap-8 lg:border-r lg:border-line lg:bg-surface lg:py-6 lg:pr-5 lg:pl-[max(1.25rem,env(safe-area-inset-left))]"
  >
    <a
      routerLink="/recipes"
      class="heading flex min-h-11 items-center text-2xl text-ink no-underline"
      >{{ appName }}</a
    >
    <nav aria-label="Main" class="flex flex-col gap-1">
      @for (item of nav; track item.path) {
      <a
        [routerLink]="item.path"
        routerLinkActive="bg-selected text-on-selected"
        ariaCurrentWhenActive="page"
        class="flex min-h-11 items-center gap-3 rounded-control px-3 font-semibold text-ink no-underline hover:bg-chip/50"
      >
        <mise-icon class="size-5" [path]="item.icon" />
        {{ item.label }}
      </a>
      }
    </nav>
  </aside>

  <div class="flex min-h-dvh min-w-0 flex-col">
    <!-- Top bar: phones and tablets -->
    <header
      class="sticky top-0 z-(--ds-z-bar) border-b border-line bg-canvas pt-[env(safe-area-inset-top)] pr-[max(1rem,env(safe-area-inset-right))] pl-[max(1rem,env(safe-area-inset-left))] lg:hidden"
    >
      <a
        routerLink="/recipes"
        class="heading flex min-h-12 items-center text-xl text-ink no-underline"
        >{{ appName }}</a
      >
    </header>

    <main
      id="main"
      tabindex="-1"
      class="w-full max-w-3xl flex-1 pt-5 pr-[max(1rem,env(safe-area-inset-right))] pb-[calc(var(--ds-tabbar-height)+env(safe-area-inset-bottom)+2rem)] pl-[max(1rem,env(safe-area-inset-left))] focus:outline-none md:mx-auto md:px-8 lg:mx-0 lg:px-10 lg:pt-10 lg:pb-12"
    >
      @if (update.ready()) {
      <div
        role="status"
        class="mb-5 flex flex-wrap items-center justify-between gap-3 rounded-card bg-selected px-4 py-3 text-on-selected"
      >
        <span>A new version of {{ appName }} is ready.</span>
        <button type="button" class="btn btn-primary" (click)="update.reload()">
          Reload
        </button>
      </div>
      }
      <router-outlet />
    </main>

    <!-- Tab bar: phones and tablets -->
    <nav
      aria-label="Main"
      class="fixed inset-x-0 bottom-0 z-(--ds-z-bar) grid grid-cols-2 border-t border-line bg-surface pr-[env(safe-area-inset-right)] pb-[env(safe-area-inset-bottom)] pl-[env(safe-area-inset-left)] lg:hidden"
    >
      @for (item of nav; track item.path) {
      <a
        [routerLink]="item.path"
        routerLinkActive="is-active text-ink"
        ariaCurrentWhenActive="page"
        class="group flex h-(--ds-tabbar-height) flex-col items-center justify-center gap-0.5 text-xs font-semibold text-ink-muted no-underline"
      >
        <span
          class="grid h-7 w-14 place-items-center rounded-chip group-[.is-active]:bg-selected group-[.is-active]:text-on-selected"
        >
          <mise-icon class="size-6" [path]="item.icon" />
        </span>
        {{ item.label }}
      </a>
      }
    </nav>
  </div>
</div>
