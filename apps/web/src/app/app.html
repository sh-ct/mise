<div
  class="min-h-dvh bg-canvas text-ink md:grid md:grid-cols-[15rem_minmax(0,1fr)]"
>
  <!-- Sidebar: tablets and desktop -->
  <aside
    class="hidden md:flex md:flex-col md:gap-8 md:border-r md:border-line md:bg-surface md:px-5 md:py-6 md:sticky md:top-0 md:h-dvh"
  >
    <a routerLink="/recipes" class="heading text-2xl text-ink no-underline"
      >{{ appName }}</a
    >
    <nav aria-label="Main" class="flex flex-col gap-1">
      @for (item of nav; track item.path) {
      <a
        [routerLink]="item.path"
        routerLinkActive="bg-chip text-on-chip"
        ariaCurrentWhenActive="page"
        class="flex min-h-11 items-center gap-3 rounded-control px-3 font-semibold text-ink no-underline hover:bg-chip"
      >
        <svg
          viewBox="0 0 24 24"
          class="size-5 fill-none stroke-current"
          stroke-width="1.8"
          stroke-linecap="round"
          stroke-linejoin="round"
          aria-hidden="true"
        >
          <path [attr.d]="item.icon" />
        </svg>
        {{ item.label }}
      </a>
      }
    </nav>
  </aside>

  <div class="flex min-h-dvh min-w-0 flex-col">
    <!-- Top bar: phones -->
    <header
      class="sticky top-0 z-10 border-b border-line bg-canvas px-4 pb-3 pt-[calc(env(safe-area-inset-top)+0.75rem)] md:hidden"
    >
      <a routerLink="/recipes" class="heading text-xl text-ink no-underline"
        >{{ appName }}</a
      >
    </header>

    <main
      class="mx-auto w-full max-w-3xl flex-1 px-4 pb-28 pt-5 md:px-8 md:pb-12 md:pt-10"
    >
      <router-outlet />
    </main>

    <!-- Tab bar: phones -->
    <nav
      aria-label="Main"
      class="fixed inset-x-0 bottom-0 z-10 grid grid-cols-2 border-t border-line bg-surface pb-[env(safe-area-inset-bottom)] md:hidden"
    >
      @for (item of nav; track item.path) {
      <a
        [routerLink]="item.path"
        routerLinkActive="is-active text-ink"
        ariaCurrentWhenActive="page"
        class="group flex min-h-14 flex-col items-center justify-center gap-0.5 text-xs font-semibold text-ink-muted no-underline"
      >
        <span
          class="grid h-7 w-14 place-items-center rounded-full group-[.is-active]:bg-chip group-[.is-active]:text-on-chip"
        >
          <svg
            viewBox="0 0 24 24"
            class="size-6 fill-none stroke-current"
            stroke-width="1.8"
            stroke-linecap="round"
            stroke-linejoin="round"
            aria-hidden="true"
          >
            <path [attr.d]="item.icon" />
          </svg>
        </span>
        {{ item.label }}
      </a>
      }
    </nav>
  </div>
</div>
